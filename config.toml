# The URL the site will be built for
base_url = "/"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true


# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false


title = "BitDevs Lomé"
description = "BitDevs Lomé est une communauté dédiée aux passionnés de Bitcoin, aux développeurs et aux chercheurs qui souhaitent échanger, approfondir leurs connaissances et contribuer à la recherche et au développement de Bitcoin ainsi que des protocoles et technologies qui gravitent autour de son écosystème."

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true

generate_feed = true

feed_filename = "rss.xml"

