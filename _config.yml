# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title
plugins: [jekyll-sitemap, jekyll-feed, jekyll-seo-tag]
incremental: true
future: true # allow posts with future dates

sass:
  sass_dir: assets/css
  style: :compressed

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
title: "BitDevs Lomé"
description: "BitDevs Lomé est une communauté dédiée aux passionnés de Bitcoin, aux développeurs et aux chercheurs qui souhaitent échanger, approfondir leurs connaissances et contribuer à la recherche et au développement de Bitcoin ainsi que des protocoles et technologies qui gravitent autour de son écosystème."

# Leave out some files
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', '.sass-cache']

